name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  # ci.yml triggers only on push and pull_request against main, so nothing it
  # runs gates a tag. Both of its jobs are repeated here: without the lint one,
  # a release published having passed the Lua suite and never having been
  # linted, which is the gate a tag most needs.
  tests:
    name: Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Lua 5.1
        uses: leafo/gh-actions-lua@6919171ccf181b826f44b9bca76307b577217377 # v13.0.0
        with:
          luaVersion: "5.1"

      - name: Run tests
        run: lua tests/run_tests.lua

  luacheck:
    name: Luacheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Lua
        uses: leafo/gh-actions-lua@6919171ccf181b826f44b9bca76307b577217377 # v13.0.0
        with:
          luaVersion: "5.1"

      - name: Install LuaRocks
        uses: leafo/gh-actions-luarocks@35d062def313a7699a0d513e996bcf4352f05389 # v6.1.0

      - name: Install luacheck
        run: luarocks install luacheck 1.2.0

      - name: Run luacheck
        run: luacheck QuickRoute/ tests/ --config .luacheckrc

  release:
    name: Package & Release
    runs-on: ubuntu-latest
    needs: [tests, luacheck]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Tag and version reach the shell through the environment, never through
      # ${{ }} interpolation into a run: block — this job holds CF_API_KEY and
      # WAGO_API_TOKEN, and a crafted tag name would otherwise execute here.
      - name: Extract version from tag
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: echo "version=${REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        id: changelog
        env:
          REF_NAME: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -o pipefail
          PREV_TAG=$(git tag --sort=-version:refname | head -2 | tail -1)
          if [ "$PREV_TAG" = "$REF_NAME" ]; then
            # First release — use all commits
            LOG=$(git log --pretty=format:"- %s" HEAD)
          else
            LOG=$(git log --pretty=format:"- %s" "$PREV_TAG".."$REF_NAME")
          fi
          # Write to file for gh release
          {
            echo "## QuickRoute $REF_NAME"
            echo ""
            echo "### Changes"
            echo "$LOG"
            echo ""
            echo "### Installation"
            echo "1. Download \`QuickRoute-${VERSION}.zip\`"
            echo "2. Extract to \`World of Warcraft/_retail_/Interface/AddOns/\`"
            echo "3. Restart WoW or \`/reload\`"
          } > /tmp/release-notes.md

      - name: Package addon
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -o pipefail
          mkdir -p dist/QuickRoute
          # Copy addon files. Tests/ ships because QuickRoute.toc lists
          # Tests\TestGraph.lua; omitting it left every published build with a
          # TOC entry pointing at a file that is not in the zip, and the
          # advertised /qrtest command missing.
          cp -r QuickRoute/Core QuickRoute/Data QuickRoute/Modules \
                QuickRoute/Textures QuickRoute/Utils QuickRoute/Tests dist/QuickRoute/
          cp QuickRoute/QuickRoute.lua QuickRoute/QuickRoute.toc QuickRoute/Localization.lua dist/QuickRoute/
          # Every file the .toc references has to be in the zip. The copy list
          # above is maintained by hand and has already shipped a build whose
          # .toc pointed at a file that was not packaged.
          #
          # Covers the .lua entries, which is what the copy list above can get
          # wrong; the .toc's other directives are not files.
          #
          # Assert the entry count first. A grep that matches nothing -- a
          # renamed .toc, the standard multi-TOC split into
          # QuickRoute_Mainline.toc -- would otherwise leave missing=0 and let
          # the check pass without having read a single entry, which is the one
          # failure mode a guard against silent packaging must not have. A CRLF
          # .toc is not that case: GNU grep still counts the entries, and each
          # path then carries a trailing \r and fails the existence check
          # below, so the step dies loudly rather than silently.
          entries=$(grep -cE '^[A-Za-z].*\.lua$' QuickRoute/QuickRoute.toc || true)
          echo "QuickRoute.toc lists ${entries} Lua entries"
          if [ "${entries:-0}" -lt 20 ]; then
            echo "::error::Read only ${entries:-0} Lua entries from QuickRoute.toc; the packaging check cannot verify anything"
            exit 1
          fi
          missing=0
          while read -r entry; do
            path="dist/QuickRoute/${entry//\\//}"
            if [ ! -f "$path" ]; then
              echo "::error::QuickRoute.toc references $entry, which is not in the package"
              missing=1
            fi
          done < <(grep -E '^[A-Za-z].*\.lua$' QuickRoute/QuickRoute.toc)
          [ "$missing" -eq 0 ]

          # Create zip
          cd dist
          zip -r "QuickRoute-${VERSION}.zip" QuickRoute/
          echo "Created QuickRoute-${VERSION}.zip ($(du -h "QuickRoute-${VERSION}.zip" | cut -f1))"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -o pipefail
          if gh release view "$REF_NAME" >/dev/null 2>&1; then
            echo "Release $REF_NAME already exists, uploading asset to existing release"
            gh release upload "$REF_NAME" "dist/QuickRoute-${VERSION}.zip" --clobber
          else
            gh release create "$REF_NAME" \
              "dist/QuickRoute-${VERSION}.zip" \
              --title "QuickRoute $REF_NAME" \
              --notes-file /tmp/release-notes.md
          fi

      - name: Attach screenshots to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          shopt -s nullglob
          for img in screenshots/*.png screenshots/*.jpg; do
            gh release upload "$REF_NAME" "$img" --clobber || true
          done

      - name: Derive the retail patch string from the TOC
        id: patch
        run: |
          set -o pipefail
          TOC_API=$(grep -oP '## Interface:\s*\K\d+' QuickRoute/QuickRoute.toc)
          MAJOR=$((TOC_API / 10000))
          MINOR=$(( (TOC_API % 10000) / 100 ))
          PATCH=$((TOC_API % 100))
          echo "toc_api=${TOC_API}" >> "$GITHUB_OUTPUT"
          echo "retail_patch=${MAJOR}.${MINOR}.${PATCH}" >> "$GITHUB_OUTPUT"
          echo "TOC Interface ${TOC_API} -> retail patch ${MAJOR}.${MINOR}.${PATCH}"

      - name: Upload localization to CurseForge
        id: localization
        continue-on-error: true
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
        run: python3 scripts/export_localization.py --upload

      - name: Upload to CurseForge
        id: curseforge
        continue-on-error: true
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          VERSION: ${{ steps.version.outputs.version }}
          TOC_API: ${{ steps.patch.outputs.toc_api }}
          RETAIL_PATCH: ${{ steps.patch.outputs.retail_patch }}
        run: |
          set -o pipefail
          # Match the game version on either the dotted name (12.1.0) or the
          # apiVersion field, whichever the API actually carries, and fail
          # loudly rather than silently publishing against the newest retail id.
          GAME_VERSION_ID=$(curl -sS --fail-with-body -H "X-Api-Token: ${CF_API_KEY}" \
            "https://wow.curseforge.com/api/game/versions" | python3 -c '
          import json, os, sys
          versions = json.load(sys.stdin)
          toc_api = os.environ["TOC_API"]
          target = os.environ["RETAIL_PATCH"]
          for pick in (lambda v: v.get("name") == target,
                       lambda v: str(v.get("apiVersion")) == toc_api):
              match = [v for v in versions if pick(v)]
              if match:
                  print(match[0]["id"])
                  break
          else:
              sys.exit("No CurseForge game version matches %s / %s" % (target, toc_api))
          ')
          echo "CurseForge game version ID: ${GAME_VERSION_ID}"
          METADATA=$(GAME_VERSION_ID="$GAME_VERSION_ID" VERSION="$VERSION" python3 -c '
          import json, os
          print(json.dumps({
              "changelog": open("/tmp/release-notes.md").read(),
              "changelogType": "markdown",
              "displayName": "QuickRoute v" + os.environ["VERSION"],
              "gameVersions": [int(os.environ["GAME_VERSION_ID"])],
              "releaseType": "release",
          }))
          ')
          HTTP_CODE=$(curl -sS -o /tmp/cf-response.json -w '%{http_code}' \
            -X POST "https://wow.curseforge.com/api/projects/1461133/upload-file" \
            -H "X-Api-Token: ${CF_API_KEY}" \
            -F "metadata=${METADATA}" \
            -F "file=@dist/QuickRoute-${VERSION}.zip")
          echo "CurseForge response (HTTP ${HTTP_CODE}): $(cat /tmp/cf-response.json)"
          echo "http_code=${HTTP_CODE}" >> "$GITHUB_OUTPUT"
          [ "$HTTP_CODE" -lt 400 ]

      - name: Upload to Wago
        id: wago
        if: always()
        continue-on-error: true
        env:
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          RETAIL_PATCH: ${{ steps.patch.outputs.retail_patch }}
        run: |
          set -o pipefail
          echo "Retail patch version: ${RETAIL_PATCH}"
          METADATA=$(python3 -c '
          import json, os
          print(json.dumps({
              "label": os.environ["VERSION"],
              "stability": "stable",
              "changelog": open("/tmp/release-notes.md").read(),
              "supported_retail_patch": os.environ["RETAIL_PATCH"],
          }))
          ')
          HTTP_CODE=$(curl -sS -o /tmp/wago-response.json -w '%{http_code}' \
            -X POST "https://addons.wago.io/api/projects/Q6aRgaKW/version" \
            -H "Authorization: Bearer ${WAGO_API_TOKEN}" \
            -H "Accept: application/json" \
            -F "metadata=${METADATA}" \
            -F "file=@dist/QuickRoute-${VERSION}.zip")
          echo "Wago response (HTTP ${HTTP_CODE}): $(cat /tmp/wago-response.json)"
          echo "http_code=${HTTP_CODE}" >> "$GITHUB_OUTPUT"
          [ "$HTTP_CODE" -lt 400 ]

      # The GitHub release is already published at this point, so the store
      # uploads run to completion and their failures are reported here instead
      # of aborting the job halfway and skipping the remaining store.
      - name: Fail the release if a store upload did not succeed
        if: always()
        env:
          CF_OUTCOME: ${{ steps.curseforge.outcome }}
          WAGO_OUTCOME: ${{ steps.wago.outcome }}
          L10N_OUTCOME: ${{ steps.localization.outcome }}
          CF_CODE: ${{ steps.curseforge.outputs.http_code }}
          WAGO_CODE: ${{ steps.wago.outputs.http_code }}
        run: |
          echo "CurseForge:   ${CF_OUTCOME} (HTTP ${CF_CODE:-none})"
          echo "Wago:         ${WAGO_OUTCOME} (HTTP ${WAGO_CODE:-none})"
          echo "Localization: ${L10N_OUTCOME}"
          failed=0
          [ "$CF_OUTCOME" = "success" ] || failed=1
          [ "$WAGO_OUTCOME" = "success" ] || failed=1
          [ "$L10N_OUTCOME" = "success" ] || failed=1
          if [ "$failed" -ne 0 ]; then
            echo "::error::A store or localization upload failed. The GitHub release was published; re-run this job after fixing it."
            exit 1
          fi
