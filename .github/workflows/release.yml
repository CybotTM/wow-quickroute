name: Release
on:
  push:
    tags:
      - 'v*'
jobs:
  # ci.yml triggers only on push and pull_request against main, so nothing it
  # runs gates a tag. Repeat its Lua, lint and Python checks before publishing.
  tests:
    # Both file orders. The files share one mock and one addon namespace, so a
    # file that borrows global state and does not put it back only breaks
    # whatever runs after it -- which in discovery order was nothing, for as long
    # as nobody added a file at the wrong position.
    name: Tests (${{ matrix.order }} order)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        order: [discovery, reverse]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Lua 5.1
        uses: leafo/gh-actions-lua@32909a2dea0a48c433aec79e7fcd31b4cd55800f # v13.1.0
        with:
          luaVersion: "5.1"
      - name: Run tests
        env:
          QR_TEST_ORDER: ${{ matrix.order }}
        run: lua tests/run_tests.lua
  luacheck:
    name: Luacheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Lua
        uses: leafo/gh-actions-lua@32909a2dea0a48c433aec79e7fcd31b4cd55800f # v13.1.0
        with:
          luaVersion: "5.1"
      - name: Install LuaRocks
        uses: leafo/gh-actions-luarocks@1c4a92caecc8f6850f673cbadfd57b3e555417ce # v6.1.1
      - name: Install luacheck
        run: luarocks install luacheck 1.2.0
      - name: Run luacheck
        run: luacheck QuickRoute/ tests/ --config .luacheckrc
  release:
    name: Package & Release
    runs-on: ubuntu-latest
    needs: [tests, luacheck, generator]
    permissions:
      contents: write
      # Build provenance. The OIDC token is what identifies this workflow, this
      # repository and this commit to the attestation store; without both of
      # these the attest step cannot record anything.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # Tag and version reach the shell through the environment, never through
      # ${{ }} interpolation into a run: block — this job holds CF_API_KEY and
      # WAGO_API_TOKEN, and a crafted tag name would otherwise execute here.
      - name: Extract version from tag
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          tag = os.environ["REF_NAME"]
          if not re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+", tag):
              raise SystemExit("Invalid stable release tag")
          version = tag[1:]
          # Both TOCs ship in the one archive: retail and WoW Forever.
          for toc in ("QuickRoute/QuickRoute.toc", "QuickRoute/QuickRoute_Camelot.toc"):
              versions = [line.split(":", 1)[1].strip()
                          for line in Path(toc).read_text().splitlines()
                          if line.startswith("## Version:")]
              if versions != [version]:
                  raise SystemExit("Release tag does not match the version in " + toc)
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("version=" + version + "\n")
          PY
      - name: Generate changelog
        id: changelog
        env:
          REF_NAME: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -o pipefail
          PREV_TAG=$(git tag --sort=-version:refname | head -2 | tail -1)
          if [ "$PREV_TAG" = "$REF_NAME" ]; then
            # First release — use all commits
            LOG=$(git log --pretty=format:"- %s" HEAD)
          else
            LOG=$(git log --pretty=format:"- %s" "$PREV_TAG".."$REF_NAME")
          fi
          # Write to file for gh release
          {
            echo "## QuickRoute $REF_NAME"
            echo ""
            echo "### Changes"
            echo "$LOG"
            echo ""
            echo "### Installation"
            echo "1. Download \`QuickRoute-${VERSION}.zip\`"
            echo "2. Extract to \`World of Warcraft/_retail_/Interface/AddOns/\` (WoW Forever: \`World of Warcraft/_forever_/Interface/AddOns/\`)"
            echo "3. Restart WoW or \`/reload\`"
          } > /tmp/release-notes.md
      - name: Package addon
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: bash scripts/package_addon.sh
      # Before the upload, so the statement exists for the exact bytes that are
      # published rather than for a rebuild of them. A downloader checks it with
      #   gh attestation verify QuickRoute-<version>.zip --repo CybotTM/wow-quickroute
      # which answers whether this workflow, at this commit, produced that file.
      # CurseForge and Wago carry no attestation of their own, so this covers the
      # GitHub download only.
      - name: Attest the build provenance of the package
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/QuickRoute-${{ steps.version.outputs.version }}.zip
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -o pipefail
          if gh release view "$REF_NAME" >/dev/null 2>&1; then
            echo "Release $REF_NAME already exists, uploading asset to existing release"
            gh release upload "$REF_NAME" "dist/QuickRoute-${VERSION}.zip" --clobber
          else
            gh release create "$REF_NAME" \
              "dist/QuickRoute-${VERSION}.zip" \
              --title "$REF_NAME" \
              --notes-file /tmp/release-notes.md
          fi
      - name: Attach screenshots to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          shopt -s nullglob
          for img in screenshots/*.png screenshots/*.jpg screenshots/*.webp; do
            gh release upload "$REF_NAME" "$img" --clobber || true
          done
      - name: Derive the retail and Forever patch strings from the TOCs
        id: patch
        run: |
          set -o pipefail
          TOC_API=$(grep -oP '## Interface:\s*\K\d+' QuickRoute/QuickRoute.toc)
          MAJOR=$((TOC_API / 10000))
          MINOR=$(( (TOC_API % 10000) / 100 ))
          PATCH=$((TOC_API % 100))
          echo "toc_api=${TOC_API}" >> "$GITHUB_OUTPUT"
          echo "retail_patch=${MAJOR}.${MINOR}.${PATCH}" >> "$GITHUB_OUTPUT"
          echo "TOC Interface ${TOC_API} -> retail patch ${MAJOR}.${MINOR}.${PATCH}"
          # WoW Forever: interface 16001 is patch 1.60.1, the same arithmetic the
          # BigWigs packager uses for every flavor.
          FOREVER_API=$(grep -oP '## Interface:\s*\K\d+' QuickRoute/QuickRoute_Camelot.toc)
          F_MAJOR=$((FOREVER_API / 10000))
          F_MINOR=$(( (FOREVER_API % 10000) / 100 ))
          F_PATCH=$((FOREVER_API % 100))
          echo "forever_patch=${F_MAJOR}.${F_MINOR}.${F_PATCH}" >> "$GITHUB_OUTPUT"
          echo "Camelot TOC Interface ${FOREVER_API} -> Forever patch ${F_MAJOR}.${F_MINOR}.${F_PATCH}"
      - name: Upload localization to CurseForge
        id: localization
        continue-on-error: true
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
        run: python3 scripts/export_localization.py --upload
      - name: Upload to CurseForge
        id: curseforge
        continue-on-error: true
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          VERSION: ${{ steps.version.outputs.version }}
          TOC_API: ${{ steps.patch.outputs.toc_api }}
          RETAIL_PATCH: ${{ steps.patch.outputs.retail_patch }}
          FOREVER_PATCH: ${{ steps.patch.outputs.forever_patch }}
        run: |
          set -o pipefail
          curl -sS --fail-with-body -H "X-Api-Token: ${CF_API_KEY}" \
            "https://wow.curseforge.com/api/game/versions" > /tmp/cf-versions.json
          # Match the game version on either the dotted name (12.1.0) or the
          # apiVersion field, whichever the API actually carries, and fail
          # loudly rather than silently publishing against the newest retail id.
          GAME_VERSION_ID=$(python3 -c '
          import json, os, sys
          versions = json.load(open("/tmp/cf-versions.json"))
          toc_api = os.environ["TOC_API"]
          target = os.environ["RETAIL_PATCH"]
          for pick in (lambda v: v.get("name") == target,
                       lambda v: str(v.get("apiVersion")) == toc_api):
              match = [v for v in versions if pick(v)]
              if match:
                  print(match[0]["id"])
                  break
          else:
              sys.exit("No CurseForge game version matches %s / %s" % (target, toc_api))
          ')
          echo "CurseForge game version ID: ${GAME_VERSION_ID}"
          # WoW Forever versions carry gameVersionTypeID 88568 -- the value the
          # BigWigs packager (release.sh, upload_curseforge) uses for its
          # "forever" flavor. The packager reads /api/game/wow/versions; whether
          # this endpoint carries the same field is not verified. A miss must not
          # cost the retail upload, so it is a warning and the file is tagged for
          # retail only. The log line that says the assumption failed:
          #   "No CurseForge WoW Forever game version named 1.60.1"
          FOREVER_VERSION_ID=$(python3 -c '
          import json, os, sys
          versions = json.load(open("/tmp/cf-versions.json"))
          target = os.environ["FOREVER_PATCH"]
          match = [v for v in versions if v.get("gameVersionTypeID") == 88568 and v.get("name") == target]
          print(match[0]["id"] if match else "")
          ')
          if [ -n "$FOREVER_VERSION_ID" ]; then
            echo "CurseForge WoW Forever game version ID: ${FOREVER_VERSION_ID}"
          else
            echo "::warning::No CurseForge WoW Forever game version named ${FOREVER_PATCH}; uploading for retail only"
          fi
          METADATA=$(GAME_VERSION_ID="$GAME_VERSION_ID" FOREVER_VERSION_ID="$FOREVER_VERSION_ID" VERSION="$VERSION" python3 -c '
          import json, os
          ids = [int(os.environ["GAME_VERSION_ID"])]
          if os.environ["FOREVER_VERSION_ID"]:
              ids.append(int(os.environ["FOREVER_VERSION_ID"]))
          print(json.dumps({
              "changelog": open("/tmp/release-notes.md").read(),
              "changelogType": "markdown",
              "displayName": "QuickRoute v" + os.environ["VERSION"],
              "gameVersions": ids,
              "releaseType": "release",
          }))
          ')
          HTTP_CODE=$(curl -sS -o /tmp/cf-response.json -w '%{http_code}' \
            -X POST "https://wow.curseforge.com/api/projects/1461133/upload-file" \
            -H "X-Api-Token: ${CF_API_KEY}" \
            -F "metadata=${METADATA}" \
            -F "file=@dist/QuickRoute-${VERSION}.zip")
          echo "CurseForge response (HTTP ${HTTP_CODE}): $(cat /tmp/cf-response.json)"
          echo "http_code=${HTTP_CODE}" >> "$GITHUB_OUTPUT"
          [[ "$HTTP_CODE" =~ ^2[0-9][0-9]$ ]]
      - name: Upload to Wago
        id: wago
        if: always()
        continue-on-error: true
        env:
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          RETAIL_PATCH: ${{ steps.patch.outputs.retail_patch }}
          FOREVER_PATCH: ${{ steps.patch.outputs.forever_patch }}
        run: |
          set -o pipefail
          echo "Retail patch version: ${RETAIL_PATCH}"
          echo "WoW Forever patch version: ${FOREVER_PATCH}"
          # Wago lists Forever patches under "forever" in
          # https://addons.wago.io/api/data/game (["1.60.1"] on 2026-11-10); the
          # BigWigs packager sends them as supported_forever_patches. That field
          # next to the singular supported_retail_patch this workflow has always
          # sent is not verified against Wago. If Wago rejects the upload with a
          # validation status (HTTP 400 or 422), it is repeated once for retail
          # only.
          metadata() {
            WITH_FOREVER="$1" python3 -c '
          import json, os
          meta = {
              "label": os.environ["VERSION"],
              "stability": "stable",
              "changelog": open("/tmp/release-notes.md").read(),
              "supported_retail_patch": os.environ["RETAIL_PATCH"],
          }
          if os.environ["WITH_FOREVER"] == "1":
              meta["supported_forever_patches"] = [os.environ["FOREVER_PATCH"]]
          print(json.dumps(meta))
          '
          }
          upload() {
            curl -sS -o /tmp/wago-response.json -w '%{http_code}' \
              -X POST "https://addons.wago.io/api/projects/Q6aRgaKW/version" \
              -H "Authorization: Bearer ${WAGO_API_TOKEN}" \
              -H "Accept: application/json" \
              -F "metadata=$1" \
              -F "file=@dist/QuickRoute-${VERSION}.zip"
          }
          HTTP_CODE=$(upload "$(metadata 1)")
          echo "Wago response (HTTP ${HTTP_CODE}): $(cat /tmp/wago-response.json)"
          # Retry on any validation status: Wago's wording for a rejected
          # supported_forever_patches has never been seen, so the body is not
          # matched. Anything else (401, 403, other 4xx, 5xx) is reported as it is,
          # with no retry.
          if [ "$HTTP_CODE" = "400" ] || [ "$HTTP_CODE" = "422" ]; then
            echo "::warning::Wago rejected the upload with the Forever patch (HTTP ${HTTP_CODE}); uploading for retail only"
            HTTP_CODE=$(upload "$(metadata 0)")
            echo "Wago response, retail only (HTTP ${HTTP_CODE}): $(cat /tmp/wago-response.json)"
          fi
          echo "http_code=${HTTP_CODE}" >> "$GITHUB_OUTPUT"
          [[ "$HTTP_CODE" =~ ^2[0-9][0-9]$ ]]
      # The GitHub release is already published at this point, so the store
      # uploads run to completion and their failures are reported here instead
      # of aborting the job halfway and skipping the remaining store.
      - name: Fail the release if a store upload did not succeed
        if: always()
        env:
          CF_OUTCOME: ${{ steps.curseforge.outcome }}
          WAGO_OUTCOME: ${{ steps.wago.outcome }}
          L10N_OUTCOME: ${{ steps.localization.outcome }}
          CF_CODE: ${{ steps.curseforge.outputs.http_code }}
          WAGO_CODE: ${{ steps.wago.outputs.http_code }}
        run: |
          echo "CurseForge:   ${CF_OUTCOME} (HTTP ${CF_CODE:-none})"
          echo "Wago:         ${WAGO_OUTCOME} (HTTP ${WAGO_CODE:-none})"
          echo "Localization: ${L10N_OUTCOME}"
          failed=0
          [ "$CF_OUTCOME" = "success" ] || failed=1
          [ "$WAGO_OUTCOME" = "success" ] || failed=1
          [ "$L10N_OUTCOME" = "success" ] || failed=1
          if [ "$failed" -ne 0 ]; then
            echo "::error::A store or localization upload failed. The GitHub release was published; re-run this job after fixing it."
            exit 1
          fi
  generator:
    # The data generator decides which taxi nodes are flight masters, which
    # zone each belongs to and where in it they sit. None of that is reachable
    # from the Lua suite, which only checks the shape of the file the generator
    # already produced -- so a filter could be inverted or the projection
    # transposed and nothing would fail. That last one actually happened.
    name: Generator
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # The survey import tests run scripts/export_data_json.lua.
      - name: Install Lua 5.1
        uses: leafo/gh-actions-lua@32909a2dea0a48c433aec79e7fcd31b4cd55800f # v13.1.0
        with:
          luaVersion: "5.1"
      - name: Run generator tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
